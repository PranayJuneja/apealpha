[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-alpha-api"
version = "0.1.0"
description = "APE Alpha research API and point-in-time backtest engine"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3.2,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pyarrow>=23,<24",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ape_alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
